# Baut Volti automatisch bei jeder Änderung auf "main" und stellt die
# fertigen Dateien unter "Releases" zum Herunterladen bereit.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"
  # Vorderer Teil der Versionsnummer. Die letzte Zahl ist die laufende Nummer
  # des Builds (zählt immer weiter, darauf verlässt sich die Update-Suche).
  VERSION_PREFIX: "0.1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen & Testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Das Stimmgerät (flutter_recorder) braucht unter Linux ALSA zum Bauen der Tests.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows-Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Schlüssel für Dropbox und Google Drive (Geheimnisse im GitHub-Projekt).
      # Fehlen sie, baut Volti trotzdem – nur ohne diese Sync-Möglichkeit.
      - name: Windows-App bauen
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: >-
          flutter build windows --release
          --build-name=${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=VOLTI_VERSION=v${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          --dart-define=DROPBOX_APP_KEY="$DROPBOX_APP_KEY"
          --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
          --dart-define=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Volti-Windows.zip
      # Installationsprogramm (Inno Setup): Startmenü, Deinstallieren in den
      # Windows-Einstellungen. Die ZIP-Datei bleibt für die Updates in der App.
      - name: Installationsprogramm erstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          # Deutsche Texte in Schweizer Schreibweise (ss statt ß).
          $isl = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\German.isl"
          $bytes = [IO.File]::ReadAllBytes($isl)
          $out = "windows\installer\German-CH.isl"
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $text = [IO.File]::ReadAllText($isl, [Text.UTF8Encoding]::new($true))
            [IO.File]::WriteAllText($out, $text.Replace([string][char]0xDF, 'ss'), [Text.UTF8Encoding]::new($true))
          } else {
            Copy-Item $isl $out
          }
          & $iscc "/DAppVersion=${{ env.VERSION_PREFIX }}.${{ github.run_number }}" windows\installer\volti.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\installer\Volti-Setup.exe Volti-Setup.exe
      # Weiterreichen an den letzten Schritt über den Cache statt über
      # „Artifacts“: deren Speicher ist bei privaten Projekten knapp (im
      # November 2026 voll, alle Builds scheiterten). Der Cache wird nach
      # 7 Tagen von selbst geleert.
      - shell: bash
        run: mkdir -p dist && cp Volti-Windows.zip Volti-Setup.exe dist/
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-windows-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  android:
    name: Android-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Mit festem Schlüssel signieren, damit Updates über die installierte
      # App gehen, auch mit Obtainium (Geheimnisse VOLTI_KEYSTORE und
      # VOLTI_KEYSTORE_PASSWORD). Bricht beim Herunterladen von Android-Teilen
      # die Verbindung ab, einmal nochmals versuchen.
      - name: Android-App bauen
        env:
          VOLTI_KEYSTORE: ${{ secrets.VOLTI_KEYSTORE }}
          VOLTI_KEYSTORE_PASSWORD: ${{ secrets.VOLTI_KEYSTORE_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$VOLTI_KEYSTORE" ]; then echo "::warning::Kein Signier-Schlüssel hinterlegt – Test-Schlüssel wird verwendet."; fi
          ARGS="--release --build-name=${{ env.VERSION_PREFIX }}.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=VOLTI_VERSION=v${{ env.VERSION_PREFIX }}.${{ github.run_number }} --dart-define=DROPBOX_APP_KEY=$DROPBOX_APP_KEY --dart-define=GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID --dart-define=GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          flutter build apk $ARGS || (echo "Zweiter Versuch …" && sleep 30 && flutter build apk $ARGS)
      - run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/Volti-Android.apk
      - uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-android-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  release:
    name: Zum Download bereitstellen
    # Nur für "main"; Android ist optional – ein Android-Fehler blockiert
    # den Windows-Download nicht.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.windows.result == 'success'
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-windows-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # Android ist optional (siehe oben).
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-android-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - run: ls -la dist
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v${{ env.VERSION_PREFIX }}.${{ github.run_number }}"
          MSG=$(printf '%s' "$COMMIT_MSG" | head -1)
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Volti $TAG" \
            --notes "Automatischer Build. Änderung: ${MSG:-manuell gestartet}" \
            --prerelease=false --latest
      # Zusätzlich im öffentlichen Download-Projekt ablegen (ohne Programmcode).
      # Von dort sucht Volti nach Updates. Fehlt der Schlüssel, wird es übersprungen.
      - name: Downloads im öffentlichen Projekt ablegen
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Kein RELEASES_TOKEN hinterlegt – übersprungen."
            exit 0
          fi
          TAG="v${{ env.VERSION_PREFIX }}.${{ github.run_number }}"
          MSG=$(printf '%s' "$COMMIT_MSG" | head -1)
          cat > notes.md <<EOT
          **Neu / New:** ${MSG:-Verbesserungen}

          ### Installieren (Windows 10/11)
          **\`Volti-Setup.exe\`** herunterladen und starten. Meldet Windows „Der Computer wurde durch Windows geschützt“: *Weitere Informationen → Trotzdem ausführen*. Ohne Installation: \`Volti-Windows.zip\` entpacken und \`Volti.exe\` starten.
          Ist Volti schon installiert, kommt das Update direkt in der App: ⚙ → *Über Volti* → *Nach Updates suchen*.

          ### Install (Windows 10/11)
          Download and run **\`Volti-Setup.exe\`**. If Windows says "Windows protected your PC": *More info → Run anyway*. Without installing: unzip \`Volti-Windows.zip\` and run \`Volti.exe\`.
          If Volti is already installed, update right in the app: ⚙ → *About Volti* → *Check for updates*.

          ### Android
          \`Volti-Android.apk\` herunterladen und öffnen. Automatische Updates: In der App *Obtainium* „App hinzufügen“ wählen und \`https://github.com/rawkhawk0663/volti-releases\` eintragen.
          Download and open \`Volti-Android.apk\`. Automatic updates: in the *Obtainium* app choose "Add app" and enter \`https://github.com/rawkhawk0663/volti-releases\`.
          EOT
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/* \
            --repo "rawkhawk0663/volti-releases" \
            --title "Volti $TAG" \
            --notes-file notes.md \
            --latest
