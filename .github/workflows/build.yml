# Baut Volti automatisch bei jeder Änderung auf "main" und stellt die
# fertigen Dateien unter "Releases" zum Herunterladen bereit.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen & Testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows-Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=VOLTI_VERSION=v0.1.${{ github.run_number }}
      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Volti-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Volti-Windows
          path: Volti-Windows.zip

  android:
    name: Android-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Bricht beim Herunterladen von Android-Teilen die Verbindung ab, einmal
      # nochmals versuchen (bereits Geladenes bleibt erhalten).
      - name: Android-App bauen
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=VOLTI_VERSION=v0.1.${{ github.run_number }} \
            || (echo "Zweiter Versuch …" && sleep 30 && flutter build apk --release --build-number=${{ github.run_number }} --dart-define=VOLTI_VERSION=v0.1.${{ github.run_number }})
      - run: cp build/app/outputs/flutter-apk/app-release.apk Volti-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Volti-Android
          path: Volti-Android.apk

  release:
    name: Zum Download bereitstellen
    # Nur für "main"; Android ist optional – ein Android-Fehler blockiert
    # den Windows-Download nicht.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.windows.result == 'success'
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          MSG=$(printf '%s' "$COMMIT_MSG" | head -1)
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Volti $TAG" \
            --notes "Automatischer Build. Änderung: ${MSG:-manuell gestartet}" \
            --prerelease=false --latest
