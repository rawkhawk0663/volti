name: volti
description: "Volti – Notenbibliothek und Notenleser für Musikerinnen und Musiker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.12.0
  uuid: ^4.6.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/volti_mark.png
    - assets/brand/volti_wordmark.png
  # Schriften für Text-Notizen (SIL Open Font License, siehe assets/fonts/OFL-*.txt)
  fonts:
    - family: VoltiSans
      fonts:
        - asset: assets/fonts/Roboto.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    - family: VoltiSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
    - family: VoltiMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
        - asset: assets/fonts/RobotoMono-Italic.ttf
          style: italic
