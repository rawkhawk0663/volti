name: volti
description: "Volti – Notenbibliothek und Notenleser für Musikerinnen und Musiker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.6.0
  crypto: ^3.0.6
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_recorder: 2.0.6
  flutter_soloud: 5.2.3
  path: ^1.9.1
  url_launcher: ^6.3.3
  share_plus: 13.3.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.12.0
  uuid: ^4.6.0
  window_manager: ^0.5.1
  desktop_drop: ^0.8.4
  onnxruntime_v2: 1.23.2+2
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/volti_mark.png
    - assets/brand/volti_wordmark.png
    # Lizenztexte der Schriften (erscheinen unter ⚙ → Lizenzen)
    - assets/fonts/OFL-Bravura.txt
    - assets/fonts/OFL-NotoSerif.txt
    - assets/fonts/OFL-Roboto.txt
    - assets/fonts/OFL-RobotoMono.txt
    - assets/fonts/OFL-IBMPlexSans.txt
    - assets/fonts/OFL-Sora.txt
    # Feste Roboto-Schnitte für selbst erzeugte PDFs (tool/make_pdf_fonts.py)
    - assets/fonts/pdf/
  # Schriften für Text-Notizen (SIL Open Font License, siehe assets/fonts/OFL-*.txt)
  fonts:
    # Schriften der Oberfläche (feste Schnitte, OFL)
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: VoltiSans
      fonts:
        - asset: assets/fonts/Roboto.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    - family: VoltiSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
    - family: VoltiMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
        - asset: assets/fonts/RobotoMono-Italic.ttf
          style: italic
